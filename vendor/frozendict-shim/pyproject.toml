[project]
name = "frozendict"
version = "2.4.7"
description = "MIT shim satisfying genanki's declared (but unused) frozendict dependency"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["immutabledict>=4.0,<5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frozendict"]
