[project]
name = "text-unidecode"
version = "1.3"
description = "MIT/ISC shim satisfying python-slugify's declared (fallback) text-unidecode dependency"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["anyascii>=0.3,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["text_unidecode"]
