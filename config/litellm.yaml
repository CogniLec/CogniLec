# S37 — LiteLLM proxy: five-tier local-first failover ladder.
#
# api_base for tier_1/tier_2 use LiteLLM's os.environ/VAR_NAME substitution
# (the same mechanism already used below for api_key) so a multi-machine
# deployment (docs/multi-gpu-setup.md) points at Machine B/C's real LAN IP
# via env vars, not by hand-editing this file. VLLM_API_BASE/LLAMACPP_API_BASE
# default (.env.example) to the docker-compose-internal hostnames, which is
# correct when everything runs on one host/compose network.
model_list:
  - model_name: tier_1_local
    litellm_params:
      model: vllm/microsoft/Phi-3-mini-3.8B-4bit
      api_base: os.environ/VLLM_API_BASE
      timeout: 60
  - model_name: tier_2_cpu
    litellm_params:
      model: llama.cpp/llama-3-8b-instruct
      api_base: os.environ/LLAMACPP_API_BASE
      timeout: 120
  - model_name: tier_3_openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30
  - model_name: tier_4_cheap
    litellm_params:
      model: together_ai/llama-3-8b-instruct
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 30

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 0
  timeout: 60
  allowed_fails: 1
  retry_after: 0
