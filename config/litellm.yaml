# S37 — LiteLLM proxy: five-tier local-first failover ladder.
model_list:
  - model_name: tier_1_local
    litellm_params:
      model: vllm/microsoft/Phi-3-mini-3.8B-4bit
      api_base: http://vllm:8000/v1
      timeout: 60
  - model_name: tier_2_cpu
    litellm_params:
      model: llama.cpp/llama-3-8b-instruct
      api_base: http://llamacpp:8080/v1
      timeout: 120
  - model_name: tier_3_openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30
  - model_name: tier_4_cheap
    litellm_params:
      model: together_ai/llama-3-8b-instruct
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 30

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 0
  timeout: 60
  allowed_fails: 1
  retry_after: 0
