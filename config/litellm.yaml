# S37 — LiteLLM proxy: five-tier local-first failover ladder.
#
# tier_1/tier_2 use the "openai/" provider prefix, not "vllm/"/"llama.cpp/".
# Those two prefixes tell LiteLLM to call the vllm/llama-cpp-python
# libraries IN-PROCESS inside the litellm container itself (which then
# needs `pip install vllm`, defeating the point of running vLLM as its own
# service on a separate GPU machine) -- confirmed live: with "vllm/" this
# fails with "No module named 'vllm'" the moment a request actually hits
# it, even though config validation and health checks all pass. "openai/"
# is the correct prefix for talking to vllm-openai's (and llama.cpp
# server's) actual OpenAI-compatible HTTP API over api_base. api_key is
# set to a placeholder because LiteLLM's openai/ provider requires some
# value even though these self-hosted servers don't check it.
#
# api_base uses LiteLLM's os.environ/VAR_NAME substitution (the same
# mechanism already used below for api_key) so a multi-machine deployment
# (docs/multi-gpu-setup.md) points at Machine B/C's real LAN IP via env
# vars, not by hand-editing this file. VLLM_API_BASE/LLAMACPP_API_BASE
# default (.env.example) to the docker-compose-internal hostnames, which is
# correct when everything runs on one host/compose network.
model_list:
  - model_name: tier_1_local
    litellm_params:
      # This must exactly match whatever --model (VLLM_MODEL) the vllm
      # container on Machine B was actually launched with -- confirmed
      # live: a mismatch here 404s with "The model `X` does not exist"
      # even though networking/auth are otherwise fine. Check with
      # `curl <machine-b-ip>:8000/v1/models` if unsure what's loaded.
      model: openai/Qwen/Qwen2.5-3B-Instruct-AWQ
      api_base: os.environ/VLLM_API_BASE
      api_key: "not-needed"
      # 60s was too tight for a real batch of utterances (vs. a trivial
      # smoke-test prompt) on Machine B's 4GB card -- confirmed live: a
      # tiny prompt completed in <1s, but a real S41 relevance-filter batch
      # from a 45s lecture clip timed out at 60s twice in a row and
      # exhausted process_session's retries, blocking flashcard generation
      # entirely. Raised to 180s, then raised again to 240s once guided_json
      # (constrained decoding, docs/gaps.md #33a follow-up) was enabled:
      # measured live, an 8-utterance guided_json call took 67-110s even
      # after outlines' per-schema FSM cache warmed up -- real trade-off,
      # constrained decoding trades raw speed for guaranteed-valid JSON.
      timeout: 240
  # Second real backend for tier_1_local, same model_name -- LiteLLM's own
  # proxy natively round-robins across multiple entries sharing one
  # model_name (router_settings.routing_strategy below), no application
  # code changes needed. This is genuine horizontal throughput across a
  # second, separate GPU -- deliberately NOT more in-process asyncio
  # concurrency against a single GPU, which was tried and made things
  # worse (docs/gaps.md #33b: two concurrent guided_json requests against
  # Machine B's one card caused contention, incomplete decisions, and
  # timeouts that succeeded fine sequentially). VLLM_API_BASE_2 points at
  # this machine's (Machine A's) own GPU, previously idle -- ASR and the
  # embedding fallback were both already forced to CPU/moved off it.
  - model_name: tier_1_local
    litellm_params:
      model: openai/Qwen/Qwen2.5-3B-Instruct-AWQ
      api_base: os.environ/VLLM_API_BASE_2
      api_key: "not-needed"
      timeout: 240
  - model_name: tier_2_cpu
    litellm_params:
      model: openai/llama-3-8b-instruct
      api_base: os.environ/LLAMACPP_API_BASE
      api_key: "not-needed"
      timeout: 120
  - model_name: tier_3_openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30
  - model_name: tier_4_cheap
    litellm_params:
      model: together_ai/llama-3-8b-instruct
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 30

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 0
  timeout: 240
  allowed_fails: 1
  retry_after: 0
