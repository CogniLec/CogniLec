# S06 Locked Model Configuration
# Frozen after bake-off gates pass — do not edit manually

# ASR Model
asr_model: "whisper-large-v3-turbo"
asr_model_revision: "main"
asr_compute_type: "fp16"
asr_device: "cuda"
asr_beam_size: 5
asr_batch_size: 16

# Embedding Model
embedding_model: "Qwen/Qwen3-Embedding-0.6B"
embedding_dim: 1024
embedding_revision: "main"
embedding_device: "cuda"
embedding_batch_size: 32

# S25 — embedding version governance
embedding_versions:
  active: "qwen3-0.6b-v1"
  registry:
    qwen3-0.6b-v1:
      model: "Qwen/Qwen3-Embedding-0.6B"
      dim: 1024
      revision: "main"
      instruction_prefix_retrieval: "Retrieve semantically similar content: "
      instruction_prefix_clustering: "Cluster semantically similar content: "
      registered_at: "2026-09-12"
      status: "active"

# S26 — context-window embedding
embedding:
  window_size: 5
  window_stride: 1
  min_window: 1

# S36 — LLM Serving Tiers (Block 6)
tiers:
  tier_1:
    model: "microsoft/Phi-3-mini-3.8B-4bit"
    quantization: "awq"
    vram_gb: 2.5
    endpoint: "http://vllm:8000/v1"
    timeout_s: 60
    gpu_required: true
  tier_2:
    model: "llama-3-8b-instruct.Q4_K_M.gguf"
    quantization: "q4_k_m"
    vram_gb: 0.0
    endpoint: "http://llamacpp:8080/v1"
    timeout_s: 120
    gpu_required: false
  tier_3:
    model: "gpt-4o-mini"
    provider: "openai"
    endpoint: "https://api.openai.com/v1"
    timeout_s: 30
    gpu_required: false
  tier_4:
    model: "llama-3-8b-instruct"
    provider: "together_ai"
    endpoint: "https://api.together.xyz/v1"
    timeout_s: 30
    gpu_required: false

# S69 — multi-LoRA adapter registry. One base model (tier_1) served with
# per-agent adapters loaded via vLLM's multi-LoRA support; version pinned
# per adapter so `agent_runs.adapter_version` (T69.6) is always traceable
# back to a specific registry entry.
adapters:
  A2_NOTE_SYNTHESIS:
    name: "a2-note-style-lora"
    version: "v1.0.0"
    base_model: "microsoft/Phi-3-mini-3.8B-4bit"
    path: "/models/loras/a2_note_style/v1.0.0"
  A6_SYLLABUS_EXTRACTION:
    name: "a6-syllabus-extraction-lora"
    version: "v1.0.0"
    base_model: "microsoft/Phi-3-mini-3.8B-4bit"
    path: "/models/loras/a6_syllabus_extraction/v1.0.0"
