all:
  hosts:
    machine-a:
      ansible_host: "192.168.9.112"
      ansible_user: "ashok"
      ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
      cuda_visible_devices: "0"
    machine-b:
      ansible_host: "192.168.9.113"
      ansible_user: "ashok"
      ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
      cuda_visible_devices: "0"
    machine-c:
      ansible_host: "192.168.9.111"
      ansible_user: "ashok"
      ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
      cuda_visible_devices: "0"
  children:
    # site.yml targets this group name ("hosts: gpu-host") -- keep all 3
    # real machines in it so the playbook still runs unchanged. Target one
    # machine at a time instead with, e.g., `--limit machine-b`.
    gpu-host:
      hosts:
        machine-a:
        machine-b:
        machine-c:
  vars:
    # Shared across all 3 machines -- per-machine values (IP, SSH user,
    # GPU device index) live on each host entry above instead, since these
    # are 3 separate physical machines (docs/multi-gpu-setup.md), not
    # multiple GPUs on one host.
    nvidia_driver_version: "580"
    cuda_version: "12.6"
    cudnn_version: "9.5"
    docker_version: "latest"
    gpu_host_user: "lis"
    workspace: "/home/{{ gpu_host_user }}/lis"
    hf_home: "/models/huggingface"
