repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: [--strict, --show-error-codes, --pretty]
        additional_dependencies:
          [
            pydantic,
            pydantic-settings,
            sqlalchemy,
            fastapi,
            types-requests,
            types-pyyaml,
            numpy,
            httpx,
            pillow,
            pyjwt,
            pypdf,
            faker,
            sse-starlette,
          ]
        exclude: ^(tests/|scripts/|migrations/)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        args: [--verbose, --redact]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, postgres, --rules, "L001,L003,L004,L005,L006,L007,L008,L009,L010,L011,L012,L013,L014,L016,L017,L018,L019,L020,L021,L022,L023,L024,L025,L026,L027,L028,L029,L030,L031,L032,L033,L034,L035,L036,L037,L038,L039,L040,L041,L042,L043,L044,L045,L046,L047,L048,L049,L050,L051,L052,L053,L054,L055,L056,L057,L058,L059,L060,L061,L062"]
        files: \.(sql|ddl)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key

  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commit Message
        entry: conventional-commit
        language: system
        stages: [commit-msg]
        args: [--types, "feat,fix,docs,style,refactor,test,chore,build,ci,perf"]
