server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;

    # SPA fallback: any unmatched path serves index.html so client-side
    # routing (if added later) and a hard refresh on a deep link both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or the HTML shell -- both need to be
    # re-fetched on every load so PWA updates and new deploys actually
    # reach users instead of being served stale from the browser cache.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed asset filenames (Vite's default) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
