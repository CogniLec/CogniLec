[project]
name = "lis"
version = "0.1.0"
description = "Lecture Intelligence System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    # Data validation
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.34,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    # Cache / queue
    "redis>=5.1,<6.0",
    "sse-starlette>=2.1,<4.0",
    # Object storage
    "minio>=7.2,<8.0",
    "boto3>=1.35,<2.0",
    # Auth
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "argon2-cffi>=23.1,<25.0",
    # HTTP
    "httpx>=0.27,<1.0",
    # Config
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    # Logging
    "structlog>=24.1,<25.0",
    # Observability
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
    "opentelemetry-exporter-otlp>=1.27,<2.0",
    # Orchestration
    "prefect>=3.0,<4.0",
    # LLM / agents
    "litellm>=1.50,<2.0",
    "instructor>=1.6,<2.0",
    # ML / embeddings
    "sentence-transformers>=3.2,<4.0",
    "bertopic>=0.16,<1.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    # ASR
    "jiwer>=3.0,<4.0",
    "faster-whisper>=1.0,<2.0",
    "ctranslate2>=4.5,<5.0",
    # ML framework
    "torch>=2.5,<3.0",
    "torchaudio>=2.5,<3.0",
    "transformers>=4.44,<5.0",
    "accelerate>=0.33,<1.0",
    # Experiment tracking
    "mlflow>=2.16,<3.0",
    # Data versioning
    "dvc>=3.0,<4.0",
    # Audio processing
    "pydub>=0.25,<1.0",
    "aiofiles>=24.1,<25.0",
    "imageio-ffmpeg>=0.6.0",
    "silero-vad>=5.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-timeout>=2.3,<3.0",
    "hypothesis>=6.101,<7.0",
    "faker>=30.1,<33.0",
    "factory-boy>=3.3,<4.0",
    "testcontainers>=4.6,<5.0",
    "pg8000>=1.30,<2.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
]
ml = [
    "jupyter>=1.0",
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.23,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "W", "C4", "PTH", "PIE", "T20", "TRY", "SIM", "RUF",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "T201"], "scripts/*" = ["T201", "PTH", "TRY003", "TRY300", "TRY400", "E501", "E741", "F401", "RUF059", "C413"], "src/eval/harness.py" = ["T201", "TRY003", "TRY400"], "migrations/*" = ["S101"] }
fixable = ["ALL"]
unfixable = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pgvector.*", "alembic.*", "structlog.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg.*", "silero_vad.*", "soundfile.*", "df.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "torchaudio.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -x --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require services)",
    "eval: Evaluation/metric tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
