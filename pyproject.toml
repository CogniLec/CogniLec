[project]
name = "lis"
version = "0.1.0"
description = "Lecture Intelligence System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    # Syllabus upload (S51): real PDF text extraction. Docling/Tesseract from
    # the spec are not installable in this environment (no system OCR
    # binary) - see docs/gaps.md gap #9. pypdf gives genuine (non-OCR) PDF
    # text extraction for digital PDFs.
    "pypdf>=5.0,<6.0",
    # Pre-existing gap hit while collecting this block's tests: EmailStr in
    # src/api/schemas/auth.py needs this optional pydantic extra, which was
    # never added despite EmailStr already being in use.
    "email-validator>=2.0,<3.0",
    # Data validation
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.34,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    # Cache / queue
    "redis>=5.1,<6.0",
    "sse-starlette>=2.1,<4.0",
    # Object storage
    "minio>=7.2,<8.0",
    "boto3>=1.35,<2.0",
    # Auth
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    # S58: Anki export (.apkg) and FSRS spaced-repetition scheduling.
    "genanki>=0.13,<1.0",
    # Gap #21: pin genanki's declared-but-unused `frozendict` (LGPLv3) dep to
    # the local MIT shim below instead of the real package (see
    # [tool.uv.sources]); listing it here makes uv treat "frozendict" as a
    # single project-wide requirement so the source override actually wins.
    "frozendict",
    # Gap #21: prefect -> python-slugify falls back to `text-unidecode`
    # (GPL/Artistic) when `unidecode` isn't installed; pin it to the local
    # MIT/ISC shim below (see [tool.uv.sources]) for the same reason as
    # `frozendict` above.
    "text-unidecode",
    "fsrs>=5.0,<6.0",
    "argon2-cffi>=23.1,<25.0",
    # HTTP
    "httpx>=0.27,<1.0",
    # Config
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    # Logging
    "structlog>=24.1,<25.0",
    # Observability
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
    "opentelemetry-exporter-otlp>=1.27,<2.0",
    # Orchestration
    "prefect>=3.0,<4.0",
    # LLM / agents
    "litellm>=1.50,<2.0",
    "instructor>=1.6,<2.0",
    # ML / embeddings
    "sentence-transformers>=3.2,<4.0",
    "bertopic>=0.16,<1.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    # ASR
    "jiwer>=3.0,<4.0",
    # Pre-existing gap hit while running the full suite for this block:
    # src/eval/harness.py imports segeval (S28/S29 segmentation eval) but it
    # was never added as a dependency, so tests/test_eval_harness.py failed
    # to collect. Unrelated to S50-S53 but blocked the whole run (addopts -x).
    "segeval>=2.0,<3.0",
    "faster-whisper>=1.0,<2.0",
    "ctranslate2>=4.5,<5.0",
    # ctranslate2 (faster-whisper's backend) needs libcublas.so.12/
    # libcudnn.so.9 at runtime for GPU decoding -- these ship as separate
    # pip packages, not bundled in torch's own wheel, and torch's own
    # transitive nvidia-* deps target a DIFFERENT CUDA ABI version
    # (confirmed: this venv's torch pulls in nvidia/cu13/libcublas.so.13,
    # which ctranslate2 cannot load -- it needs the .so.12 SONAME
    # specifically). Pinned here (not a manual `uv pip install`) so they
    # survive `uv sync --frozen` in the Docker build instead of being
    # silently dropped, which is exactly what happened before this was a
    # real pyproject.toml dependency (docs/gaps.md #20).
    "nvidia-cublas-cu12>=12.1",
    "nvidia-cudnn-cu12>=9.0",
    # ML framework
    "torch>=2.5,<3.0",
    "torchaudio>=2.5,<3.0",
    "transformers>=4.44,<5.0",
    "accelerate>=0.33,<1.0",
    # Experiment tracking
    "mlflow>=2.16,<3.0",
    # Audio processing
    "pydub>=0.25,<1.0",
    "aiofiles>=24.1,<25.0",
    "imageio-ffmpeg>=0.6.0",
    "silero-vad>=5.0",
    "soundfile>=0.14.0",
    # S59: EXIF/GPS stripping and perceptual-hash near-duplicate detection.
    "piexif>=1.1.3,<2.0",
    "imagehash>=4.3,<5.0",
    # S60: OpenCV-based OCR preprocessing (deskew, perspective, de-glare).
    "opencv-python-headless>=4.10,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-timeout>=2.3,<3.0",
    "hypothesis>=6.101,<7.0",
    "faker>=30.1,<33.0",
    "factory-boy>=3.3,<4.0",
    "testcontainers>=4.6,<5.0",
    "pg8000>=1.30,<2.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
]
ml = [
    "jupyter>=1.0",
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.23,<6.0",
]
# Gap #21: `dvc` is only ever shelled out to as an external CLI (see
# src/services/finetuning/export.py's `dvc_add`) for offline training-dataset
# versioning; it is never imported by the API/worker runtime. Scoping it to
# an extra keeps its transitive copyleft-flagged deps (asyncssh, dulwich,
# pygit2 via scmrepo; grandalf directly) out of the default runtime install.
finetuning-ops = [
    "dvc>=3.0,<4.0",
]

[tool.uv.sources]
# Gap #21: genanki declares `frozendict` (LGPLv3) but its 0.13.1 source never
# imports it (verified empty grep). Satisfy the unused requirement with a
# local MIT shim (vendor/frozendict-shim) instead of installing the real
# LGPLv3 package.
frozendict = { path = "vendor/frozendict-shim" }
# Gap #21: prefect's python-slugify dependency falls back to text-unidecode
# (GPL/Artistic) when `unidecode` isn't installed; satisfied with a local
# ISC-backed shim (vendor/text-unidecode-shim, using anyascii) instead.
text-unidecode = { path = "vendor/text-unidecode-shim" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "W", "C4", "PTH", "PIE", "T20", "TRY", "SIM", "RUF",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "T201", "TRY003", "E501"], "scripts/*" = ["T201", "PTH", "TRY003", "TRY300", "TRY400", "E501", "E741", "F401", "RUF059", "C413"], "src/eval/harness.py" = ["T201", "TRY003", "TRY400"], "migrations/*" = ["S101"] }
fixable = ["ALL"]
unfixable = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "alembic.*",
    "structlog.*",
    "boto3.*",
    "botocore.*",
    "sklearn.*",
    "genanki.*",
    "fsrs.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg.*", "silero_vad.*", "soundfile.*", "df.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["piexif.*", "imagehash.*", "cv2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["immutabledict.*", "anyascii.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "torchaudio.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.ml.clustering.tasks", "src.ml.embedding.flows", "src.services.orchestration.session_pipeline"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "nemo.*",
    "pyannote.*",
    "segeval.*",
    "jiwer.*",
    "scipy.*",
    "torch.*",
    "sentence_transformers.*",
    "prefect.*",
    "umap.*",
    "hdbscan.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -x --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require services)",
    "eval: Evaluation/metric tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
