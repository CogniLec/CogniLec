name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        working-directory: src/client
        run: npm ci

      - name: Build (GitHub Pages base path + baked-in API URL)
        working-directory: src/client
        env:
          GITHUB_PAGES: "true"
          # VITE_API_BASE_URL is baked in at build time (Vite env vars are
          # compile-time, not runtime -- see src/client/Dockerfile's own
          # comment on this). Set a VITE_API_BASE_URL repository secret
          # pointing at wherever the real API is currently reachable
          # (Settings -> Secrets and variables -> Actions) and re-run this
          # workflow whenever that address changes. The fallback below is
          # a Cloudflare quick tunnel from 2026-09-16 -- ephemeral by
          # design (docs/multi-gpu-setup.md), will eventually stop
          # working, and MUST be replaced with the secret once a
          # permanent API address exists.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://issued-soviet-partly-bangkok.trycloudflare.com' }}
        run: npm run build

      # Runtime API address (src/client/src/config.ts loadRuntimeConfig):
      # written from the same secret so clients pick up a changed address
      # from config.json without needing a new JS bundle / service worker.
      - name: Write runtime config.json
        env:
          API_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          python3 -c "import json,os;json.dump({'apiBaseUrl':os.environ.get('API_URL','')},open('src/client/dist/config.json','w'))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
